services:
  # 1. PostgreSQL Database
  - type: postgres
    name: resolve-postgres
    plan: free
    ipAllowList: []
    databaseName: resolve_ai
    user: resolve_user

  # 2. Redis In-Memory Cache
  - type: redis
    name: resolve-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # 3. FastAPI Backend & AI Gateway
  - type: web
    name: resolve-backend
    env: docker
    dockerfilePath: deployment/docker/Dockerfile.backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: resolve-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # 4. React SaaS Frontend Portal
  - type: web
    name: resolve-frontend
    env: static
    buildCommand: cd apps/frontend && npm install && npm run build
    staticPublishPath: apps/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: resolve-backend
          property: url
