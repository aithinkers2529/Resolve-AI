apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolve-backend
  labels:
    app: resolve-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resolve-backend
  template:
    metadata:
      labels:
        app: resolve-backend
    spec:
      containers:
      - name: backend
        image: resolve-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: resolve-config
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resolve-backend-service
spec:
  selector:
    app: resolve-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolve-frontend
  labels:
    app: resolve-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resolve-frontend
  template:
    metadata:
      labels:
        app: resolve-frontend
    spec:
      containers:
      - name: frontend
        image: resolve-frontend:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: resolve-frontend-service
spec:
  selector:
    app: resolve-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
