version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: resolve-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resolve_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resolve-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: resolve-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resolve_ai
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: MOCK_JWT_KEY_SECRET_FOR_compose
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai_engine:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.ai_engine
    container_name: resolve-ai-engine
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resolve_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: resolve-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
