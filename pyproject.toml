[tool.poetry]
name = "resolve-ai-monorepo"
version = "0.1.0"
description = "Autonomous Customer Dispute Resolution Platform using Agentic AI"
authors = ["Resolve-AI Engineering Team <info@resolve.ai>"]
readme = "README.md"
packages = [
    { include = "db_shared", from = "libs" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
python-multipart = "^0.0.9"
email-validator = "^2.1.1"
sqlalchemy = "^2.0.28"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
redis = "^5.0.3"
langchain = "^0.1.12"
langgraph = "^0.0.30"
google-generativeai = "^0.4.0"
chromadb = "^0.4.24"
cloudinary = "^1.39.0"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
prometheus-client = "^0.20.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.9.0"
locust = "^2.24.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
